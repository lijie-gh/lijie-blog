<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLM-9000 高涵道比涡扇发动机 · 工业级三维模型</title>
<style>
  :root{
    --bg:#08090c; --panel:rgba(14,17,23,.88); --line:rgba(130,160,210,.14);
    --txt:#e3e9f2; --dim:#8b98ab; --acc:#5fb2ff; --acc2:#7ee0c8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;color:var(--txt)}
  #app{position:fixed;inset:0}
  #app canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.5) 100%)}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:30}
  #title{top:18px;left:18px;padding:14px 18px;max-width:350px}
  #title h1{font-size:17px;font-weight:600;letter-spacing:.5px}
  #title h1 em{font-style:normal;color:var(--acc)}
  #title p{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.55}
  #title .spec{display:flex;gap:13px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);flex-wrap:wrap}
  #title .spec div{font-size:10.5px;color:var(--dim)}
  #title .spec b{display:block;font-size:13px;color:var(--txt);font-weight:600;margin-bottom:1px}
  #status{top:18px;right:18px;padding:10px 14px;font-size:11.5px;display:flex;gap:14px;align-items:center}
  #audit{color:var(--acc2)} #audit.bad{color:#ff7b72}
  #fps{color:var(--dim);min-width:52px;text-align:right}
  #leftCol{top:200px;left:18px;bottom:18px;width:242px;display:flex;
    flex-direction:column;gap:10px}
  #parts{flex:1;min-height:0;display:flex;flex-direction:column}
  #parts h3{font-size:11.5px;color:var(--dim);font-weight:600;padding:11px 14px 8px;
    letter-spacing:1px;border-bottom:1px solid var(--line)}
  #parts ul{list-style:none;overflow-y:auto;padding:6px;flex:1}
  #parts li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;
    font-size:12.5px;cursor:pointer;transition:background .15s}
  #parts li:hover{background:rgba(95,178,255,.10)}
  #parts li.sel{background:rgba(95,178,255,.18);outline:1px solid rgba(95,178,255,.35)}
  #parts li .nm{flex:1}
  #parts li .nm small{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.3px}
  #parts li .eye{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);flex:none}
  #parts li .eye.off{opacity:.35}
  #parts::-webkit-scrollbar{width:6px}
  #parts::-webkit-scrollbar-thumb{background:rgba(120,150,200,.2);border-radius:3px}
  #ctrl{flex:none;padding:13px 16px}
  .crow{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12px}
  .crow:last-child{margin-bottom:0}
  .crow label{width:66px;color:var(--dim);flex:none}
  .crow input[type=range]{flex:1;accent-color:var(--acc);height:3px}
  .crow .val{width:36px;text-align:right;color:var(--txt);font-size:11px;flex:none}
  .switch{position:relative;width:34px;height:18px;flex:none;cursor:pointer}
  .switch input{opacity:0;width:0;height:0}
  .switch i{position:absolute;inset:0;background:rgba(120,150,200,.22);border-radius:10px;transition:.2s;font-style:normal}
  .switch i:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;
    background:#cfd8e6;top:3px;left:3px;transition:.2s}
  .switch input:checked + i{background:rgba(95,178,255,.55)}
  .switch input:checked + i:before{left:19px;background:#fff}
  #info{bottom:18px;right:18px;width:305px;padding:15px 17px;display:none}
  #info.show{display:block}
  #info h4{font-size:14.5px;font-weight:600}
  #info h4 small{color:var(--acc);font-size:10.5px;font-weight:400;margin-left:8px;letter-spacing:.5px}
  #info p{font-size:12px;color:var(--dim);line-height:1.65;margin-top:7px}
  #info .meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  #info .meta span{font-size:10.5px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--acc2)}
  #info .close{position:absolute;top:10px;right:12px;color:var(--dim);cursor:pointer;font-size:14px}
  #info .close:hover{color:#fff}
  #hint{top:18px;left:50%;transform:translateX(-50%);padding:8px 18px;font-size:11px;
    color:var(--dim);white-space:nowrap}
  #presets{bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:9px 11px}
  .pbtn{padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:rgba(95,178,255,.06);
    color:var(--txt);font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
  .pbtn:hover{background:rgba(95,178,255,.16)}
  .pbtn.on{background:rgba(95,178,255,.30);border-color:rgba(95,178,255,.6);color:#fff}
  #stepcard{display:none;bottom:122px;left:50%;transform:translateX(-50%);
    padding:12px 20px;max-width:640px;text-align:center}
  #stepcard.show{display:block}
  #stepcard h4{font-size:15px;color:var(--acc);letter-spacing:1px}
  #stepcard p{font-size:13px;color:var(--txt);margin-top:5px;line-height:1.6}
  #stepcard .lg{display:flex;gap:14px;justify-content:center;margin-top:7px;
    font-size:10.5px;color:var(--dim)}
  #stepcard .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-right:4px;vertical-align:-1px}
  #stepbar{display:none;bottom:18px;left:50%;transform:translateX(-50%);
    padding:9px 14px;align-items:center;gap:12px}
  #stepbar.show{display:flex}
  #stepbar button{background:rgba(95,178,255,.10);color:var(--txt);
    border:1px solid var(--line);border-radius:7px;padding:5px 13px;
    cursor:pointer;font-size:13px}
  #stepbar button:hover{background:rgba(95,178,255,.22)}
  #stepdots{display:flex;gap:7px}
  .sdot{width:9px;height:9px;border-radius:50%;background:rgba(120,150,200,.3);
    cursor:pointer;transition:.2s}
  .sdot.on{background:var(--acc);transform:scale(1.25)}
  #flowbar{display:none;bottom:66px;left:50%;transform:translateX(-50%);padding:10px 14px;
    gap:14px;align-items:center;max-width:94vw}
  #flowbar.show{display:flex}
  #flowbar canvas{border:1px solid var(--line);border-radius:8px;background:rgba(10,14,20,.5)}
  #stations{display:flex;align-items:center;flex-wrap:nowrap}
  .st{padding:5px 10px;border:1px solid var(--line);border-radius:8px;text-align:center;min-width:92px}
  .st b{font-size:11px;color:var(--txt);display:block;margin-bottom:2px}
  .st span{font-size:10px;color:var(--dim);display:block;line-height:1.45}
  .st i{font-style:normal;color:var(--acc2)}
  .st.hot span i.t{color:#ffab6b}
  .sarrow{color:var(--dim);font-size:13px;padding:0 5px}
  #flowtags{position:fixed;inset:0;pointer-events:none;z-index:15}
  .ftag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;
    background:rgba(10,18,28,.82);border:1px solid rgba(126,224,200,.55);border-radius:8px;
    padding:3px 11px;font-size:11.5px;color:#cfeee6;white-space:nowrap;display:none}
  .ftag b{color:#7ee0c8;font-weight:600}
  #tags{position:fixed;inset:0;pointer-events:none;z-index:15}
  .tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
    background:rgba(12,16,24,.88);border:1px solid rgba(95,178,255,.45);border-radius:7px;
    padding:3px 10px;font-size:11.5px;color:var(--txt);white-space:nowrap;display:none}
  .tag b{color:var(--acc);font-weight:600;margin-right:6px}
  .tag:hover{background:rgba(95,178,255,.22)}
  #tip{position:fixed;pointer-events:none;padding:5px 11px;border-radius:7px;font-size:12px;
    background:rgba(10,14,20,.92);border:1px solid rgba(95,178,255,.4);color:var(--txt);
    display:none;z-index:50;white-space:nowrap}
  #loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:99;gap:16px;transition:opacity .6s}
  #loader .ring{width:44px;height:44px;border:3px solid rgba(95,178,255,.18);
    border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{font-size:13px;color:var(--dim);letter-spacing:2px}
  #loader button{display:none;padding:8px 22px;background:rgba(95,178,255,.15);
    color:var(--acc);border:1px solid var(--acc);border-radius:8px;cursor:pointer;font-size:13px}
  @media (max-width:1240px){
    #presets,#flowbar{display:none}
  }
  @media (max-width:1100px){
    #hint{display:none} #title{max-width:250px}
    #title .spec{display:none} #title p{display:none}
    #leftCol{top:84px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div class="panel" id="title">
  <h1><em>GLM-9000</em> 高涵道比涡轮风扇发动机</h1>
  <p>工业级交互式三维样机 · PBR 材质 / 全尺寸细节建模<br>双转子 · 20 叶片宽弦风扇 · 环形燃烧室</p>

<div id="presets" class="panel">

  <div class="lg">
    <span>白色流线 = 气流路径</span>
    <span>亮端 = 流动方向</span>

</div>

  <button id="stepPrev">◀ 上一步</button>

<script type="module">
/* ============================================================================
   GLM-9000 高涵道比涡扇发动机 · 工业级参数化模型 v2
   ----------------------------------------------------------------------------
   写实路线:
   · 全套程序化 PBR 纹理(颜色/粗糙度/法线): 面板缝·铆钉行·车削纹·做旧油污·
     热氧化变色·积碳·技术喷涂标识·蜂窝声学衬层·气膜孔
   · 外部机械细节: 附件机匣+腹部整流罩(发电机/起动机/燃油泵)、VSV 作动环、
     燃油/滑油/引气管路(波纹管+卡箍)、EGT 测量环、点火电缆、排水桅杆
   · 定制摄影棚环境(长条柔光箱) → 金属拉丝高光
   防穿模纪律(与 v1 相同):
   · 流道线全部由 pw() 分段函数推导, 叶尖间隙恒定可解析
   · 连接一律"埋入实体", 新增管路按 机匣面+固定偏移 走线
   · AUDIT 在启动时校验全部配合副
   轴向 X(负=前), 径向 r, 绕 X 回转。
============================================================================ */

const BOOT = async () => {
const THREE = await import('three');
const { OrbitControls }   = await import('three/addons/controls/OrbitControls.js');

/* ================= 工具 ================= */
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function pw(pts){ return x=>{
  if(x<=pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++) if(x<=pts[i][0]){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i];
    return lerp(y0,y1,(x-x0)/(x1-x0));
  }
  return pts[pts.length-1][1];
};}

/* ================= 渲染器 / 场景 ================= */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true, alpha:false, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.localClippingEnabled=true;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x08090c);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,120);
camera.position.set(7.4,2.6,8.6);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.2,0,0);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.minDistance=2.6; controls.maxDistance=40;
controls.maxPolarAngle=Math.PI*0.94;
controls.autoRotate=true; controls.autoRotateSpeed=0.7;

/* ---- 定制摄影棚环境: 黑房间 + 三条柔光箱(产生金属长条高光) ---- */
{
  const env=new THREE.Scene();
  const box=new THREE.Mesh(new THREE.BoxGeometry(30,20,30),
    new THREE.MeshBasicMaterial({color:new THREE.Color(0.016,0.017,0.02), side:THREE.BackSide}));
  env.add(box);
  const light=(w,h,x,y,z,ry,rx,c,i)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({color:new THREE.Color(c[0]*i,c[1]*i,c[2]*i)}));
    m.position.set(x,y,z); m.rotation.set(rx||0,ry||0,0); env.add(m);
  };
  light(16,5, 0, 9.5, 0, 0, Math.PI/2, [5,5,5.2], 1.6);      // 顶部大柔光箱
  light(3,14,-14.5, 3, 0, Math.PI/2, 0, [2.4,3.0,3.8], 1.2); // 左冷光条
  light(3,14, 14.5, 3, 0, -Math.PI/2, 0, [3.8,3.1,2.2], 1.2);// 右暖光条
  light(10,3, 0, 2, -14.9, 0, 0, [0.5,0.55,0.65], 1);        // 背景补光
  light(16,6, 0, -9.5, 0, 0, -Math.PI/2, [0.25,0.25,0.28],1);// 底部微反
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(env,0.045).texture;
  pm.dispose();
}
const key=new THREE.DirectionalLight(0xfff1de,1.4); key.position.set(5,9,6); scene.add(key);
const rim=new THREE.DirectionalLight(0xbcd6ff,0.55); rim.position.set(-8,3,-7); scene.add(rim);

const clipPlane=new THREE.Plane(new THREE.Vector3(0,0,-1),0);

/* ================= 程序纹理库 ================= */
const RNG=(s=>()=> (s=(s*16807)%2147483647)/2147483647)(1234567);
const P=new Uint8Array(512);
{ const a=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=RNG()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}
  for(let i=0;i<512;i++)P[i]=a[i&255]; }
const fade=t=>t*t*(3-2*t);
function vnoise(x,y){
  const xi=Math.floor(x)&255, yi=Math.floor(y)&255, xf=x-Math.floor(x), yf=y-Math.floor(y);
  const h=(i,j)=>P[(P[(i&255)]+ (j&255))&255]/255;
  const u=fade(xf), v=fade(yf);
  return lerp(lerp(h(xi,yi),h(xi+1,yi),u), lerp(h(xi,yi+1),h(xi+1,yi+1),u), v);
}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.1;a*=.5;}return s;}
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function T(c,repeat=true){
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  return t;
}
function Tr(c,repeat=true){ // 非颜色贴图(粗糙度/法线) 不做 sRGB 编码
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  return t;
}
// 高度图 → 法线图 (Sobel)
function h2n(hc,strength=3){
  const w=hc.width,h=hc.height,ctx=hc.getContext('2d');
  const src=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);
  const H=(x,y)=>src.data[(((y+h)%h)*w+((x+w)%w))*4]/255;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength, dy=(H(x,y+1)-H(x,y-1))*strength;
    const inv=1/Math.hypot(dx,dy,1), i=(y*w+x)*4;
    out.data[i]=(-dx*inv*.5+.5)*255; out.data[i+1]=(-dy*inv*.5+.5)*255;
    out.data[i+2]=(inv*.5+.5)*255; out.data[i+3]=255;
  }
  ctx.putImageData(out,0,0); return hc;
}
// 灰度图绘制器: fn(x,y)->0..1
function grayCanvas(w,h,fn){
  const c=cnv(w,h),ctx=c.getContext('2d'),img=ctx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const v=clamp(fn(x/w,y/h),0,1)*255, i=(y*w+x)*4;
    img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0); return c;
}

/* ================= 几何工具 ================= */
function lathe(profile,mat,segs=140){
  const pts=profile.map(p=>new THREE.Vector2(p[1],p[0]));
  if(Math.hypot(pts[0].x-pts[pts.length-1].x,pts[0].y-pts[pts.length-1].y)>1e-6)
    pts.push(pts[0].clone());
  const g=new THREE.LatheGeometry(pts,segs); g.rotateZ(-Math.PI/2);
  return new THREE.Mesh(g,mat);
}
function sectorLathe(profile,mat,phi0,phiLen,segs=48){    // 部分回转(腹部整流罩等)
  const pts=profile.map(p=>new THREE.Vector2(p[1],p[0]));
  if(Math.hypot(pts[0].x-pts[pts.length-1].x,pts[0].y-pts[pts.length-1].y)>1e-6)
    pts.push(pts[0].clone());
  const g=new THREE.LatheGeometry(pts,segs,phi0,phiLen); g.rotateZ(-Math.PI/2);
  return new THREE.Mesh(g,mat);
}
function caseShell(fn,t,x0,x1,n=12,mat){
  const out=[],inn=[];
  for(let i=0;i<=n;i++){const x=lerp(x0,x1,i/n); out.push([x,fn(x)]);}
  for(let i=n;i>=0;i--){const x=lerp(x0,x1,i/n); inn.push([x,fn(x)-t]);}
  return lathe([...out,...inn],mat);
}
const nacaT=u=>10*(0.2969*Math.sqrt(u)-0.1260*u-0.3516*u*u+0.2843*u**3-0.1015*u**4);
const camberY=u=>4*u*(1-u);
/* 参数化叶片: NACA 叶型沿叶高扭转/变弦长/掠形, 含 UV(u=环向 v=展向) */
function bladeGeometry(o){
  const span=o.spanSeg||22, div=o.chordDiv||12;
  const rowLen=(div+1)*2, pos=[],uv=[],idx=[];
  for(let i=0;i<=span;i++){
    const t=i/span, r=lerp(o.r0,o.r1,t), c=lerp(o.c0,o.c1,t);
    const st=lerp(o.s0,o.s1,t), sw=lerp(o.sw0||0,o.sw1||0,t);
    const tk=lerp(o.t0??o.thk,o.t1??o.thk,t), cm=lerp(o.cm0??o.cam,o.cm1??o.cam,t);
    const ca=Math.cos(st), sa=Math.sin(st);
    const sec=[];
    for(let j=0;j<=div;j++) sec.push([j/div,1]);
    for(let j=div;j>=0;j--) sec.push([j/div,-1]);
    for(let k=0;k<sec.length;k++){
      const [u,sd]=sec[k];
      const a=(u-0.42)*c+sw, q=camberY(u)*cm*c+sd*nacaT(u)*tk*0.5*c;
      pos.push(a*ca-q*sa, r, a*sa+q*ca); uv.push(k/sec.length, t);
    }
  }
  for(let i=0;i<span;i++){
    const b0=i*rowLen,b1=(i+1)*rowLen;
    for(let j=0;j<rowLen;j++){
      const j2=(j+1)%rowLen;
      idx.push(b0+j,b0+j2,b1+j, b0+j2,b1+j2,b1+j);
    }}
  for(const row of [0,span]){
    const base=row*rowLen; let cx=0,cy=0,cz=0;
    for(let j=0;j<rowLen;j++){cx+=pos[(base+j)*3];cy+=pos[(base+j)*3+1];cz+=pos[(base+j)*3+2];}
    const ci=pos.length/3; pos.push(cx/rowLen,cy/rowLen,cz/rowLen); uv.push(.5,row?1:0);
    for(let j=0;j<rowLen;j++){const j2=(j+1)%rowLen; idx.push(base+j,base+j2,ci);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function bladeRing(geo,mat,n){
  const im=new THREE.InstancedMesh(geo,mat,n), m=new THREE.Matrix4();
  for(let k=0;k<n;k++){m.makeRotationX(k/n*Math.PI*2); im.setMatrixAt(k,m);}
  im.instanceMatrix.needsUpdate=true; return im;
}
function roundedBox(w,h,d,r,mat){                        // 圆角盒(附件机匣等)
  const s=new THREE.Shape();
  const x=w/2-r,y=h/2-r;
  s.moveTo(-x-r,y); s.lineTo(x,y); s.quadraticCurveTo(x+r,y,x+r,y-r);
  s.lineTo(x+r,-y+r); s.quadraticCurveTo(x+r,-y+r,x,-y-r);
  s.lineTo(-x,-y-r); s.quadraticCurveTo(-x-r,-y-r,x-r,-y+r);
  s.lineTo(-x-r,y-r); s.quadraticCurveTo(-x-r,y,-x-r,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:d-r*2,bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:3,curveSegments:6});
  g.center(); return new THREE.Mesh(g,mat);
}
/* 法兰 + 双侧螺栓 */
function flange(x,rIn,rOut,mat,matBolt,nBolt,group){
  group.add(lathe([[x-0.05,rIn],[x-0.05,rOut],[x+0.05,rOut],[x+0.05,rIn]],mat));
  const bg=new THREE.CylinderGeometry(0.02,0.022,0.065,6); bg.rotateZ(Math.PI/2);
  const bolts=new THREE.InstancedMesh(bg,matBolt,nBolt), m=new THREE.Matrix4();
  for(let k=0;k<nBolt;k++){
    const a=k/nBolt*Math.PI*2, rr=rOut-0.033;
    m.makeRotationX(a).setPosition(x+0.014,rr*Math.cos(a),rr*Math.sin(a));
    bolts.setMatrixAt(k,m);
  }
  bolts.instanceMatrix.needsUpdate=true; group.add(bolts);
}
/* 管路: CatmullRom 走管 + 波纹管环 + 卡箍 */
function tubeRun(pts,radius,mat,opts={}){
  const curve=new THREE.CatmullRomCurve3(pts);
  const segs=Math.max(16,pts.length*10);
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(new THREE.TubeGeometry(curve,segs,radius,10),mat));
  if(opts.bellows){
    const n=opts.bellows;
    const tor=new THREE.TorusGeometry(radius*1.3,radius*.45,8,14);
    const im=new THREE.InstancedMesh(tor,mat,n);
    const m=new THREE.Matrix4(),q=new THREE.Quaternion(),
          z=V3(0,0,1),t=V3(),p=V3(),one=V3(1,1,1);
    for(let i=0;i<n;i++){
      const tt=(i+.5)/n; curve.getPointAt(tt,p); curve.getTangentAt(tt,t);
      q.setFromUnitVectors(z,t); m.compose(p,q,one); im.setMatrixAt(i,m);
    }
    im.instanceMatrix.needsUpdate=true; grp.add(im);
  }
  return {grp,curve};
}

 [-7.0,1.25,2.30],[-5.0,1.22,2.15],[-4.2,1.18,2.05],[-3.45,1.12,1.94],
 [-2.6,1.06,1.94],[-2.1,1.04,1.92],[-0.8,1.10,1.925],[0.55,0.99,1.87],
 [1.40,1.105,1.895],[2.90,1.075,1.60],[4.40,1.15,1.55],[7.0,1.05,1.62]];
// 外部绕流流管(贴短舱外表面, 风洞可视化; 上侧收拢避免悬空感)
const EXT_WP=[
 [-8.0,1.95,2.72],[-5.2,1.92,2.60],[-4.3,1.95,2.42],[-3.4,2.08,2.16],
 [-1.8,2.18,2.12],[0.2,2.10,2.05],[1.8,1.88,1.95],[2.9,1.66,1.80],
 [4.4,1.56,1.72],[8.0,1.50,1.74]];
function buildTube(wps,f){
  const pts=wps.map(([x,a,b])=>pol(x,0,lerp(a,b,f)));
  return new THREE.CatmullRomCurve3(pts).getSpacedPoints(FLOWSEG);  // 直接返回点数组
}
// 速度剖面: 风扇盘处突跳(风扇对气流做功), OGV 后整直微降
const uCore=pw([[-7,.22],[-4.6,.19],[-3.5,.20],[-3.44,.46],[-2.9,.50],[-2.66,.44],
  [-2.3,.40],[-0.4,.30],[0.7,.22],[1.5,.27],[2.1,.60],[3.4,.78],[4.35,1.05],[6,1.30],[7.5,1.35]]);
const uByp=pw([[-7,.22],[-4.6,.19],[-3.5,.20],[-3.44,.48],[-2.0,.60],[1.5,.68],
  [2.9,.85],[4.4,1.0],[7.5,1.05]]);
const uExt=pw([[-8,.30],[-3.4,.33],[2.9,.52],[8,.58]]);
// 颜色停靠点 [x, r,g,b, a]
const CORE_C=[[-7,.55,.80,1,.7],[-3.45,.52,.78,1,.9],[0.9,.25,.42,1,.95],
  [1.35,1,.58,.22,1],[1.9,1,.85,.42,1],[2.8,1,.50,.30,.95],[4.2,1,.55,.34,.8],
  [6.0,.8,.42,.34,.35],[7.5,.7,.38,.32,0]];
const BYP_C=[[-7,.5,.82,1,.25],[-4,.55,.85,1,.6],[2.9,.5,.82,1,.55],
  [4.6,.55,.85,1,.4],[7,.5,.8,1,.08]];
const EXT_C=[[-8,.55,.75,.95,.05],[-4,.6,.8,1,.22],[2.9,.55,.78,1,.20],[8,.5,.72,.95,.04]];
function evalStops(stops,x,out){
  if(x<=stops[0][0]){const s=stops[0];out[0]=s[1];out[1]=s[2];out[2]=s[3];out[3]=s[4];return;}
  for(let i=1;i<stops.length;i++) if(x<=stops[i][0]){
    const A=stops[i-1],B=stops[i],t=(x-A[0])/(B[0]-A[0]);
    out[0]=lerp(A[1],B[1],t);out[1]=lerp(A[2],B[2],t);
    out[2]=lerp(A[3],B[3],t);out[3]=lerp(A[4],B[4],t);return;}
  const s=stops[stops.length-1];out[0]=s[1];out[1]=s[2];out[2]=s[3];out[3]=s[4];
}
const flowSys=(()=>{
  // k: 0=外部绕流 1=外涵道 2=核心涵道 (长飘带; 数量已按剖切可视象限补偿)
  const NBP=700, NCP=500, NEXT=200, N=NBP+NCP+NEXT;
  const tubes=[];
  for(let i=0;i<9;i++)  tubes.push({sp:buildTube(BYP_WP,i/8),k:1});
  for(let i=0;i<10;i++) tubes.push({sp:buildTube(CORE_WP,i/9),k:2});
  for(let i=0;i<8;i++)  tubes.push({sp:buildTube(EXT_WP,i/7),k:0});
  const TUB=new Uint8Array(N), S=new Float32Array(N), A=new Float32Array(N);
  for(let i=0;i<N;i++){
    TUB[i]= i<NEXT? i%8 : (i<NEXT+NBP? 8+(i-NEXT)%9 : 17+(i-NEXT-NBP)%10);
    S[i]=RNG(); A[i]=RNG()*Math.PI*2;      // 独立圆周角 → 立体环形流场
  }
  const pos=new Float32Array(N*2*3), col=new Float32Array(N*2*3);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  // 半透明白色流线(风洞样式): 亮头暗尾示意方向; 高不透明度保证亮背景可读
  const mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,
    opacity:.92,blending:THREE.NormalBlending,depthWrite:false});
  const lines=new THREE.LineSegments(geo,mat);
  lines.renderOrder=8; lines.visible=false; lines.frustumCulled=false;
  scene.add(lines);
  const _c=[0,0,0,0], _v=new THREE.Vector3(), _lw=[1e9,1e9];
  const swirlOf=pw([[-3.45,0],[-3.1,0.55],[-2.66,1.05],[-2.3,0.10],   // 风扇旋流→OGV整直
                    [2.06,0],[2.2,0.16],[3.4,0.42],[4.3,0.18],[5.2,0.05]]); // 涡轮旋流→衰减
  function sampleTube(t,s,out){
    const seg=Array.isArray(t)?t:t.sp, kk=clamp(isFinite(s)?s:0,0,1)*(seg.length-1),
          i=Math.min(seg.length-2,Math.max(0,Math.floor(kk))), f=kk-i;
    out.lerpVectors(seg[i],seg[i+1],f);
  }
  function place(t,s,ang,out,k){          // 基础点(y=r,z=0) → 绕轴角 ang+swirl(仅内涵流)
    sampleTube(t,s,out);
    const r=out.y, sw=k>=1?swirlOf(out.x):0;
    let aBase=ang;
    if(cutMode>0){                        // 剖视时流线约束在保留的半边内(留旋流余量)
      aBase=Math.PI+1.15+(ang/(2*Math.PI))*(Math.PI-2.3);
    }
    const a=aBase+sw;
    out.y=r*Math.cos(a); out.z=r*Math.sin(a);
  }
  function update(dt){
    const K=0.30*(0.15+0.85*throttle)*flowMaster;
    const win=x=>{                              // 分段窗口(原理演示逐步聚焦, 羽化边缘)
      const e=1.4;
      const a=clamp((x-mX[0])/e,0,1), b=clamp((mX[1]-x)/e,0,1);
      return a*b*(3-2*a)*(3-2*b)*0.8+0.2*Math.min(a,b);
    };
    // 窗口变化时重建每条流管在窗口内的弧长范围; 粒子均匀重铺到窗内循环(步内满密度)
    if(Math.abs(mX[0]-_lw[0])>0.05||Math.abs(mX[1]-_lw[1])>0.05){
      _lw[0]=mX[0]; _lw[1]=mX[1];
      for(let ti=0;ti<tubes.length;ti++){
        const tu=tubes[ti], seg=tu.sp;
        let i0=-1,i1=-1;
        for(let i=0;i<seg.length;i++){
          if(seg[i].x>=mX[0]-0.3&&seg[i].x<=mX[1]+0.3){
            if(i0<0)i0=i; i1=i; }
        }
        if(i0<0){i0=0;i1=seg.length-1;}
        tu.i0=i0; tu.i1=Math.max(i1,i0+1);
        const sA=tu.i0/(seg.length-1), sB=tu.i1/(seg.length-1);
        for(let n=0;n<N;n++) if(TUB[n]===ti) S[n]=sA+RNG()*(sB-sA);
      }
    }
    for(let n=0;n<N;n++){
      const tu=tubes[TUB[n]], k=tu.k,
            u=k===0?uExt:(k===1?uByp:uCore);
      const L=tu.sp.length-1, sMax=tu.i1/L, sMin=tu.i0/L;
      const span=(sMax-sMin)>1e-4?(sMax-sMin):1e-4;
      sampleTube(tu.sp,S[n],_v);               // 先取当前位置
      const u0=u(_v.x);                        // 该处流速
      S[n]+=u0*dt*K*span;                      // 再推进
      if(S[n]>=sMax||!isFinite(S[n])){ S[n]=sMin+((S[n]-sMax)%span+span)%span; A[n]=RNG()*Math.PI*2; }
      if(S[n]<sMin) S[n]=sMin;
      sampleTube(tu.sp,S[n],_v);
      const streak=0.045+u0*0.065;             // 长飘带: 连续感而非碎段
      const h=(n*2)*3, t=(n*2+1)*3;
      place(tu.sp,S[n],A[n],_v,k); pos[h]=_v.x;pos[h+1]=_v.y;pos[h+2]=_v.z;
      place(tu.sp,S[n]-streak,A[n],_v,k); pos[t]=_v.x;pos[t+1]=_v.y;pos[t+2]=_v.z;
      const fx=mK[k]*win(_v.x);                // 类型×区段 双重遮罩
      if(fx<0.004){                            // 完全遮蔽的粒子压缩到原点省渲染
        pos[h]=pos[t]=0; pos[h+1]=pos[t+1]=0;
        pos[h+2]=pos[t+2]=0;
        col[h]=col[t]=0;col[h+1]=col[t+1]=0;col[h+2]=col[t+2]=0;
        continue;
      }
      evalStops(k===0?EXT_C:(k===1?BYP_C:CORE_C),_v.x,_c);
      let a=_c[3]*flowMaster*fx, heat=1;
      if(k===2&&_v.x>0.95&&_v.x<4.8) heat=0.45+0.55*throttle;
      // 统一白色流线: 全段等亮度, 外部绕流减淡, 仅用透明度区分
      const base=(k===0?(STEPS[stepMode.i]&&STEPS[stepMode.i].all?0.55:0.30):1)*heat;
      col[h]=base;col[h+1]=base;col[h+2]=base;
      col[t]=base*.4;col[t+1]=base*.4;col[t+2]=base*.4;
    }
    geo.attributes.position.needsUpdate=true;
    geo.attributes.color.needsUpdate=true;
  }
  function probe(){                         // 粒子状态探针(供程序化验证)
    let nz=0, masked=0;
    const bk=[0,0,0,0,0];                   // x: <-4 / -4..0 / 0..3 / >3 / 其他(被清零)
    for(let i=0;i<N;i++){const j=i*6;
      const m=Math.abs(pos[j])+Math.abs(pos[j+1])+Math.abs(pos[j+2]);
      if(m>1e-6){ nz++;
        const x=pos[j];
        if(x<-4)bk[0]++; else if(x<0)bk[1]++; else if(x<3)bk[2]++; else bk[3]++;
      } else { masked++; bk[4]++; } }
    return {alive:nz,masked,total:N,
      bk, mx:[+mX[0].toFixed(2),+mX[1].toFixed(2)],mk:mK.map(v=>+v.toFixed(2)),
      rng:tubes.map(t=>[t.i0??-1,t.i1??-1]).slice(0,30),
      s0:[+pos[0].toFixed(3),+pos[1].toFixed(3),+pos[2].toFixed(3)],
      s1:[+pos[6].toFixed(3),+pos[7].toFixed(3),+pos[8].toFixed(3)],
      s2:[+pos[12].toFixed(3),+pos[13].toFixed(3),+pos[14].toFixed(3)]};
  }
  return {update,probe,mat,
    set visible(v){lines.visible=v;},
    get visible(){return lines.visible;}};
})();

/* ---- 站位数据 + P-T 曲线 ---- */
const STDATA=[
  {n:'风扇进口',P:101,T:288},{n:'风扇出口',P:145,T:335},{n:'HPC 出口',P:1850,T:705},
  {n:'燃烧室出口',P:1780,T:1580},{n:'涡轮出口',P:320,T:985},{n:'尾喷口',P:215,T:810}];
const stEl=document.getElementById('stations');
stEl.innerHTML=STDATA.map(s=>
  `<div class="st${s.T>900?' hot':''}"><b>${s.n}</b><span>P <i class="p">—</i> kPa</span><span>T <i class="t">—</i> K</span></div>`)
  .join('<span class="sarrow">›</span>');
const stNodes=[...stEl.querySelectorAll('.st')];
function refreshStations(){
  const k=0.15+0.85*throttle;
  STDATA.forEach((s,i)=>{
    const P=101+(s.P-101)*Math.pow(k,1.7), T=288+(s.T-288)*Math.pow(k,1.6);
    stNodes[i].querySelector('.p').textContent=P.toFixed(0);
    stNodes[i].querySelector('.t').textContent=T.toFixed(0);
  });
}
const drawPTChart=(()=>{ // 可重绘闭包
  const c=document.getElementById('ptChart'),g=c.getContext('2d');
  return ()=>{
    g.clearRect(0,0,c.width,c.height);
    g.font='10px sans-serif';
    g.fillStyle='#8b98ab'; g.fillText('沿程参数',8,12);
    g.fillStyle='#7ee0c8'; g.fillText('— 总压',8,26);
    g.fillStyle='#ffab6b'; g.fillText('— 总温',8,39);
    const k=0.15+0.85*throttle, kk=Math.pow(k,1.7), kt=Math.pow(k,1.6);
    const curve=(vals,color)=>{
      g.strokeStyle=color; g.lineWidth=2; g.beginPath();
      vals.forEach((v,i)=>{
        const x=46+i/(vals.length-1)*(c.width-56), y=c.height-12-v*(c.height-58);
        i?g.lineTo(x,y):g.moveTo(x,y);
      }); g.stroke();};
    curve(STDATA.map(s=>(s.P-101)*kk/1750),'#7ee0c8');
    curve(STDATA.map(s=>((s.T-288)*kt)/1300),'#ffab6b');
  };
})();

const _fc=new THREE.Vector3();
function updateFlowChips(){
  const show=flowOn&&flowMaster>0.3;
  const az=Math.atan2(camera.position.z-controls.target.z,
                      camera.position.y-controls.target.y);
  FLOWCHIPS.forEach((c,i)=>{
    let vis=false;
    if(show){
      _fc.copy(pol(c.x,az,c.r)).project(camera);
      if(_fc.z<1){ vis=true;
        chipEls[i].style.left=((_fc.x*0.5+0.5)*innerWidth)+'px';

  });

function setFlow(on){
  flowOn=on;
  $('flowChk').checked=on; $('flowVal').textContent=on?'开启':'关闭';
  if(!stepMode.on) document.getElementById('flowbar').classList.remove('show');
  if(on){
    if(cutMode===0) setCut(2,true);            // 自动 ¼ 剖, 保证内部流动可见
    if(throttle<0.15){ throttle=0.45; $('rpmSlider').value=45;
      $('rpmVal').textContent='45%'; }
    refreshStations();
  }
  if(linerMatRef){ linerMatRef.emissive.setHex(on?0xff5a00:0x000000);
    linerMatRef.emissiveIntensity=on?0.55:0; }
}

 {t:'⑥ 膨胀做功',d:'高温燃气冲击涡轮叶片膨胀做功：涡轮经同心转轴驱动前方的风扇与压气机。',

 {t:'⑦ 喷气推力',d:'燃气经尾喷管高速喷出：动量变化产生向前的反作用力——这就是推力。',

  k:[1,1,1],x:[-9,9],cam:[0.2,0.9,12.4,0.3,0,0],all:true}];
const stepMode={on:false,i:0,t:0};
const dotsEl=document.getElementById('stepdots');
STEPS.forEach((s,i)=>{
  const d=document.createElement('span'); d.className='sdot'; d.title=s.t;
  d.addEventListener('click',()=>goStep(i)); dotsEl.appendChild(d);
});
function goStep(i){
  stepMode.i=clamp(i,0,STEPS.length-1); stepMode.t=0;
  const s=STEPS[stepMode.i];
  for(let j=0;j<3;j++) mKT[j]=s.k[j];
  mXT[0]=s.x[0]; mXT[1]=s.x[1];
  document.getElementById('stepTitle').textContent=s.t;
  document.getElementById('stepDesc').textContent=s.d;
  [...dotsEl.children].forEach((d,j)=>d.classList.toggle('on',j===stepMode.i));
  document.getElementById('flowbar').classList.toggle('show',!!s.all);
  qaLock=null;                                   // 解除旧锁, 使用运镜
  tweenCam(V3(...s.cam.slice(0,3)),V3(...s.cam.slice(3)),1.6);
}
function enterSteps(){
  stepMode.on=true;
  clearPreset();
  asmAnim.playing=false; expTween=null;          // 硬复位爆炸/装配状态
  explodeK=0; applyExplode();
  const pct=0; $('expSlider').value=pct; $('expVal').textContent=pct+'%';
  setFlow(true); setCut(1,true); setAuto(false);
  if(throttle<0.5){ throttle=0.6; $('rpmSlider').value=60; $('rpmVal').textContent='60%'; }
  ['title','leftCol','hint','presets'].forEach(id=>$(id).style.display='none');
  document.getElementById('stepcard').classList.add('show');
  document.getElementById('stepbar').classList.add('show');
  goStep(0);
}
function exitSteps(){
  stepMode.on=false;
  mKT[0]=mKT[1]=mKT[2]=1; mXT[0]=-9; mXT[1]=9;
  document.getElementById('flowbar').classList.remove('show');
  document.getElementById('stepcard').classList.remove('show');
  document.getElementById('stepbar').classList.remove('show');
  ['title','leftCol','hint','presets'].forEach(id=>$(id).style.display='');
  setFlow(false); setCut(0); setAuto(true);
}
document.getElementById('stepPrev').addEventListener('click',()=>goStep(stepMode.i-1));
document.getElementById('stepNext').addEventListener('click',()=>goStep(stepMode.i+1));
document.getElementById('stepExit').addEventListener('click',exitSteps);
let _stTimer=0;
function flowTick(dt){
  const tgt=flowOn?1-clamp(explodeK*20,0,1):0;      // 爆炸时气流淡出
  flowMaster+=(tgt-flowMaster)*Math.min(1,dt*5);
  // 遮罩平滑过渡
  for(let i=0;i<3;i++) mK[i]+=(mKT[i]-mK[i])*Math.min(1,dt*3);
  mX[0]+=(mXT[0]-mX[0])*Math.min(1,dt*2.5);
  mX[1]+=(mXT[1]-mX[1])*Math.min(1,dt*2.5);
  flowSys.visible=flowMaster>0.02;
  if(flowSys.visible) flowSys.update(dt);
  if(linerMatRef) linerMatRef.emissiveIntensity=flowOn?(0.3+0.5*throttle)*flowMaster:0;
  // 步进演示自动推进
  if(stepMode.on){ stepMode.t+=dt;
    if(stepMode.t>7&&stepMode.i<STEPS.length-1) goStep(stepMode.i+1); }
  _stTimer+=dt;
  if(flowOn&&_stTimer>0.25&&document.getElementById('flowbar').classList.contains('show')){
    _stTimer=0; refreshStations(); drawPTChart(); }
}

/* ---- 零件总数统计(每片叶片/每颗螺栓单独计数) ---- */
let partCount=0;
engine.traverse(o=>{ if(o.isMesh) partCount+=(o.isInstancedMesh?o.count:1); });
document.getElementById('partCount').textContent=partCount.toLocaleString();

/* ---- 工程剖面线: 剖视开启时, 被剖开的内壁(背面)渲染为斜纹剖面样式 ---- */
const cutUniform={value:0};
for(const m of MATS){
  m.onBeforeCompile=sh=>{
    sh.uniforms.uCutStyle=cutUniform;
    sh.vertexShader=sh.vertexShader
      .replace('#include <clipping_planes_pars_vertex>',
        '#include <clipping_planes_pars_vertex>\nvarying vec3 vCutPos;')
      .replace('#include <project_vertex>',
        `#include <project_vertex>
         vec4 cp4=vec4(transformed,1.0);
         #ifdef USE_INSTANCING
         cp4=instanceMatrix*cp4;
         #endif
         vCutPos=(modelMatrix*cp4).xyz;`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <clipping_planes_pars_fragment>',
        '#include <clipping_planes_pars_fragment>\nvarying vec3 vCutPos;\nuniform float uCutStyle;')
      .replace('#include <dithering_fragment>',
        `if(!gl_FrontFacing&&uCutStyle>0.5){
           float hh=fract((vCutPos.y+vCutPos.z)*22.0);
           float ss=step(0.5,hh);
           gl_FragColor.rgb=mix(vec3(0.82,0.85,0.90),vec3(0.16,0.18,0.23),ss);
         }
         #include <dithering_fragment>`);
  };
  m.customProgramCacheKey=()=>'cutstyle';
}

/* ================= 间隙自检 ================= */
(function runAudit(){
  const bad=AUDIT.filter(x=>!x.ok);
  const el=document.getElementById('audit');
  if(bad.length){ el.textContent=`装配间隙自检 ✗ ${bad.length} 项超差`; el.classList.add('bad');
    console.warn('间隙自检未通过:',bad); }
  else el.textContent=`装配间隙自检 ✓ ${AUDIT.length}/${AUDIT.length} 通过`;
  console.table(AUDIT);
})();

/* ================= 交互状态 ================= */
let explodeK=0;
const EXP_DELAY={nacelle:0,cowl:.05,agb:.08,extern:.10,spinner:.06,fan:.11,
  ogv:.16,lpc:.19,hpc:.22,combustor:.25,hpt:.27,lpt:.29,nozzle:.30,plug:.30,shafts:0};
const applyExplode=()=>{                       // 级联时序: 大壳体先行, 核心件依次跟进
  for(const a of Object.values(ASM)){
    const d=EXP_DELAY[a.id]||0;
    let kk=clamp((explodeK-d)/0.70,0,1);
    kk=kk*kk*(3-2*kk);                         // smoothstep
    if(a.id==='cowl'){                         // 检修门: 绕顶部铰链旋转开启(纯旋转, 无平移)
      for(const pv of a.group.children)
        if(pv.userData.sign!==undefined) pv.rotation.x=pv.userData.sign*0.95*kk;
      continue;
    }
    a.group.position.copy(a.explode).multiplyScalar(kk);
  }};
/* ---- 剖视系统: 0 关 / 1 半剖 / 2 ¼剖(双面) + 剖切扫描 + 内部补光 ---- */
let cutMode=0, cutSweepT=null;
const planeY=new THREE.Plane(new THREE.Vector3(0,-1,0),0);   // 切去 y>0 象限
const innerLights=[
  [-3.3,0xffd9a8,26],[0.6,0xffd0a0,30],[2.7,0xffc890,26],
].map(([x,c,i])=>{
  const l=new THREE.PointLight(c,i,7,2); l.position.set(x,0,0);
  l.visible=false; scene.add(l); return l;
});
function setCut(mode,sweep=false){
  if(mode===cutMode&&!sweep) return;
  cutMode=mode;
  cutUniform.value=mode>0?1:0;                  // 剖面线开关(注入着色器)
  const planes=mode===2?[clipPlane,planeY]:mode===1?[clipPlane]:null;
  // 流线不做剖切裁剪: 以透视(x-ray)方式叠加在剖视图上, 教科书剖视图画法
  for(const m of MATS){ m.clippingPlanes=planes; m.needsUpdate=true; }
  innerLights.forEach(l=>l.visible=mode>0);
  if(mode>0&&sweep){ cutSweepT={t:0}; clipPlane.constant=2.9; }
  else { clipPlane.constant=0; cutSweepT=null; }
  $('cutChk').checked=mode>0;
  $('cutVal').textContent=mode===2?'¼剖':mode===1?'开启':'关闭';
}
let throttle=0.22;
const spin={n1:0,n2:0};
let qaLock=null;

/* ================= UI ================= */
const partsList=document.getElementById('partsList');
const tipEl=document.getElementById('tip');
const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
let hoverAsm=null, selAsm=null, focusTween=null;
for(const [id,a] of Object.entries(ASM)){
  const li=document.createElement('li'); li.dataset.id=id;
  li.innerHTML=`<span class="nm">${a.info.n}<small>${a.info.en}</small></span>
    <span class="eye" title="显示/隐藏">👁</span>`;
  partsList.appendChild(li);
  li.addEventListener('click',e=>{
    if(e.target.classList.contains('eye')){
      const g=ASM[id].group; g.visible=!g.visible;
      e.target.classList.toggle('off',!g.visible); return;
    }
    selectAsm(id); focusOn(id);
  });
}
const setEmissive=(a,hex)=>{ if(a) for(const m of a.mats) m.emissive.setHex(hex); };
function selectAsm(id){
  if(selAsm){ setEmissive(ASM[selAsm],0x000000);
    partsList.querySelector(`li[data-id=${selAsm}]`)?.classList.remove('sel'); }
  selAsm=id;
  if(id){ setEmissive(ASM[id],0x1d3d5c);
    partsList.querySelector(`li[data-id=${id}]`)?.classList.add('sel');
    const inf=ASM[id].info;
    document.getElementById('infoName').firstChild.textContent=inf.n;
    document.getElementById('infoEn').textContent=inf.en;
    document.getElementById('infoDesc').textContent=inf.d;
    document.getElementById('infoMeta').innerHTML=inf.m.map(x=>`<span>${x}</span>`).join('');
    document.getElementById('info').classList.add('show');
  }else document.getElementById('info').classList.remove('show');
}
function focusOn(id){
  const a=ASM[id]; if(!a.box){
    a.box=new THREE.Box3().setFromObject(a.group);
    const c=new THREE.Vector3(),s=new THREE.Vector3();
    a.box.getCenter(c); a.box.getSize(s);
    a.focus={c,r:Math.max(s.x,s.y,s.z)*0.72+0.4};
  }
  const f=a.focus, dir=camera.position.clone().sub(controls.target).normalize();
  focusTween={t:0,p0:camera.position.clone(),
    p1:f.c.clone().add(dir.multiplyScalar(f.r*2.4)),
    g0:controls.target.clone(),g1:f.c.clone()};
}
document.getElementById('infoClose').addEventListener('click',()=>selectAsm(null));
renderer.domElement.addEventListener('pointermove',e=>{
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  tipEl.style.left=(e.clientX+14)+'px'; tipEl.style.top=(e.clientY+10)+'px';
});
renderer.domElement.addEventListener('pointerleave',()=>{tipEl.style.display='none';});
let downPos=null;
renderer.domElement.addEventListener('pointerdown',e=>{downPos=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos) return;
  const moved=Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1]); downPos=null;
  if(moved>5) return;
  selectAsm(hoverAsm); if(hoverAsm) focusOn(hoverAsm);
});
function pickHover(){
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObject(engine,true);
  let id=null;
  for(const h of hits){ let o=h.object;
    while(o&&!o.userData.asm) o=o.parent;
    if(o&&o.visible){id=o.userData.asm;break;} }
  if(id!==hoverAsm){
    if(hoverAsm&&hoverAsm!==selAsm) setEmissive(ASM[hoverAsm],0x000000);
    hoverAsm=id;
    if(id&&id!==selAsm) setEmissive(ASM[id],0x16283c);
    if(id){tipEl.style.display='block';tipEl.textContent=ASM[id].info.n+' · '+ASM[id].info.en;}
    else tipEl.style.display='none';
    renderer.domElement.style.cursor=id?'pointer':'grab';
  }
}
const $=id=>document.getElementById(id);
$('cutChk').addEventListener('change',e=>{clearPreset();
  setCut(e.target.checked?1:0,true);});
$('expSlider').addEventListener('input',e=>{clearPreset();
  explodeK=e.target.value/100; $('expVal').textContent=e.target.value+'%'; applyExplode();});
$('rpmSlider').addEventListener('input',e=>{throttle=e.target.value/100;
  $('rpmVal').textContent=e.target.value+'%';});
$('rotChk').addEventListener('change',e=>{controls.autoRotate=e.target.checked;
  $('rotVal').textContent=e.target.checked?'开启':'关闭';});
$('flowChk').addEventListener('change',e=>{clearPreset();setFlow(e.target.checked);});
$('replayBtn').addEventListener('click',()=>{clearPreset();playAssembly();});

/* ---- 运镜补间 / 场景预设 ---- */
let camTween=null, expTween=null;
const tweenCam=(p,g,dur=1.5)=>{ focusTween=null;
  camTween={t:0,dur,p0:camera.position.clone(),p1:p,g0:controls.target.clone(),g1:g}; };
const tweenExplode=(to,dur=1.8)=>{ asmAnim.playing=false; expTween={t:0,dur,from:explodeK,to}; };
const setAuto=on=>{controls.autoRotate=on;$('rotChk').checked=on;
  $('rotVal').textContent=on?'开启':'关闭';};
const PRESETS={
  show:   ()=>{ setFlow(false); tweenExplode(0,1.2); setCut(0); setAuto(true);
                tweenCam(V3(7.4,2.6,8.6),V3(-0.2,0,0),1.7); },
  half:   ()=>{ tweenExplode(0,0.9); setCut(1,true); setAuto(false);
                tweenCam(V3(4.8,1.8,7.4),V3(0.2,0,0),1.5); },
  quarter:()=>{ tweenExplode(0,0.9); setCut(2,true); setAuto(false);
                tweenCam(V3(-1.2,2.2,10.6),V3(0,0.1,0),1.5); },
  flow:   ()=>{ enterSteps(); return; },
  explode:()=>{ setCut(2,true); tweenExplode(1,2.4); setAuto(false);
                tweenCam(V3(4.4,3.0,12.8),V3(0.6,0,0),2.0); },
};
function clearPreset(){ document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('on')); }
document.querySelectorAll('.pbtn').forEach(b=>b.addEventListener('click',()=>{
  const p=b.dataset.p;
  if(p!=='flow'&&stepMode.on) exitSteps();        // 切换其他模式时退出演示
  clearPreset(); b.classList.add('on');
  if(p==='asm') playAssembly(); else PRESETS[p]();
}));
addEventListener('keydown',e=>{ if(e.key==='Escape'&&stepMode.on) exitSteps(); });

/* ---- 爆炸态零件标注牌(投影跟随, 可点击) ---- */
const tagEls=(()=>{ const box=new THREE.Box3(), arr=[];
  Object.values(ASM).forEach((a,i)=>{
    box.setFromObject(a.group); const c=box.getCenter(new THREE.Vector3());
    const d=document.createElement('div'); d.className='tag';
    d.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b>${a.info.n}`;
    d.addEventListener('click',()=>{selectAsm(a.id);focusOn(a.id);});
    document.getElementById('tags').appendChild(d);
    arr.push({a,c,d});
  }); return arr; })();
const _tv=new THREE.Vector3();
function updateTags(){
  const show=explodeK>0.22&&!qaLock;
  for(const {a,c,d} of tagEls){
    let vis=false;
    if(show&&a.group.visible){
      const dl=EXP_DELAY[a.id]||0;                  // 与部件相同的级联延迟, 消除标注错位
      let kk=clamp((explodeK-dl)/0.70,0,1); kk=kk*kk*(3-2*kk);
      _tv.copy(c).addScaledVector(a.explode,kk).project(camera);
      if(_tv.z<1){ vis=true;
        d.style.left=((_tv.x*0.5+0.5)*innerWidth)+'px';
        d.style.top =((-_tv.y*0.5+0.5)*innerHeight-10)+'px'; } }
    d.style.display=vis?'block':'none';
  }
}

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let frames=0,fpsT=0,rafN=0;
function animate(){
  requestAnimationFrame(animate);
  rafN++;
  const dt=Math.min(clock.getDelta(),0.05);
  if(qaLock){ camera.position.copy(qaLock.p); controls.target.copy(qaLock.t); }
  // 剖切扫描
  if(cutSweepT){ cutSweepT.t+=dt/2.2;
    const s=1-Math.pow(1-Math.min(cutSweepT.t,1),3);
    clipPlane.constant=lerp(2.9,0,s);
    if(cutSweepT.t>=1){ clipPlane.constant=0; cutSweepT=null; } }
  // 爆炸补间
  if(expTween){ expTween.t+=dt/expTween.dur;
    const s=1-Math.pow(1-Math.min(expTween.t,1),3);
    explodeK=lerp(expTween.from,expTween.to,s); applyExplode();
    const pct=Math.round(explodeK*100);
    $('expSlider').value=pct; $('expVal').textContent=pct+'%';
    if(expTween.t>=1) expTween=null; }
  // 运镜补间
  if(camTween){ camTween.t+=dt/camTween.dur;
    const s=1-Math.pow(1-Math.min(camTween.t,1),3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,s);
    controls.target.lerpVectors(camTween.g0,camTween.g1,s);
    if(camTween.t>=1) camTween=null; }
  spin.n1+=dt*throttle*5.2; spin.n2+=dt*throttle*8.4;
  for(const g of rotorsN1) g.rotation.x=spin.n1;
  for(const g of rotorsN2) g.rotation.x=spin.n2;
  if(focusTween){
    focusTween.t=Math.min(1,focusTween.t+dt/0.9);
    const k=1-Math.pow(1-focusTween.t,3);
    camera.position.lerpVectors(focusTween.p0,focusTween.p1,k);
    controls.target.lerpVectors(focusTween.g0,focusTween.g1,k);
    if(focusTween.t>=1) focusTween=null;
  }
  controls.update(); if(!qaLock){ asmAnimTick(); pickHover(); } flowTick(dt); updateTags();
  renderer.render(scene,camera);
  frames++; fpsT+=dt;
  if(fpsT>=.5){ $('fps').textContent=Math.round(frames/fpsT)+' FPS'; frames=0; fpsT=0; }
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ---- 入场: 摄影机推进 + 装配收拢动画 ---- */
camera.position.set(-14,6.5,15);
const intro={t:0,p0:camera.position.clone(),p1:V3(7.4,2.6,8.6)};
(function introAnim(){
  if(qaLock) return;
  intro.t=Math.min(1,intro.t+0.012);
  const k=1-Math.pow(1-intro.t,3);
  camera.position.lerpVectors(intro.p0,intro.p1,k);
  if(intro.t<1) requestAnimationFrame(introAnim);
})();

/* ---- 开机装配动画: 从"爆炸+剖视"收拢到整机 ---- */
const asmAnim={t:0,playing:false};
function playAssembly(){
  if(qaLock) return;
  asmAnim.t=0; asmAnim.playing=true;
  explodeK=1; applyExplode(); setCut(2);
  $('expSlider').value=100; $('expVal').textContent='100%';
}
function asmAnimTick(){
  if(!asmAnim.playing) return;
  asmAnim.t+=1/300;
  const k=1-Math.pow(clamp(asmAnim.t/0.92,0,1),3);
  explodeK=k; applyExplode();
  const pct=Math.round(explodeK*100);
  $('expSlider').value=pct; $('expVal').textContent=pct+'%';
  if(asmAnim.t>0.55&&cutMode>0) setCut(0);
  if(asmAnim.t>=1) asmAnim.playing=false;
}
renderer.domElement.addEventListener('pointerdown',()=>{
  if(asmAnim.playing) asmAnim.t=Math.max(asmAnim.t,0.9);   // 交互即快进
});

/* ---- QA / 调试钩子 ---- */
window.__qa={
  state:()=>({audit:document.getElementById('audit').textContent,
    explode:explodeK,cut:cutMode,throttle,flow:flowOn,
    cam:[camera.position.x,camera.position.y,camera.position.z]}),
  flow:(on)=>{setFlow(on); if(on)setCut(1,false);},
  step:(i)=>{ try{
      if(!stepMode.on) enterSteps();
      if(i!==undefined) goStep(i);
      return {i:stepMode.i,on:stepMode.on};
    }catch(e){ return {err:String(e&&e.message||e),stack:String(e&&e.stack||'').slice(0,200)}; } },
  flowprobe:()=>({master:flowMaster,on:flowOn,vis:flowSys.visible,...flowSys.probe()}),
  tick:(dt)=>flowTick(dt||0.05),
  raf:()=>rafN,
  diag:()=>({on:flowOn,ek:explodeK,m:flowMaster,thr:throttle,
    src:flowTick.toString().replace(/\s+/g,' ').slice(0,120)}),
  set(cut,explode,rpm){
    asmAnim.playing=false; camTween=null; expTween=null; cutSweepT=null;
    clipPlane.constant=0;
    setCut(cut===2?2:cut?1:0,false); explodeK=explode; applyExplode(); throttle=rpm;
    $('cutChk').checked=cut; $('cutVal').textContent=cut?'开启':'关闭';
    $('expSlider').value=explode*100; $('expVal').textContent=Math.round(explode*100)+'%';
    $('rpmSlider').value=rpm*100; $('rpmVal').textContent=Math.round(rpm*100)+'%';
    controls.autoRotate=false;
  },
  view(px,py,pz,tx,ty,tz){
    qaLock={p:V3(px,py,pz),t:V3(tx,ty,tz)};
    camera.position.copy(qaLock.p); controls.target.copy(qaLock.t);
    controls.autoRotate=false; controls.update(); renderer.render(scene,camera);
  },
  unlock(){qaLock=null;},
  spin(deg){for(const g of rotorsN1)g.rotation.x=deg*Math.PI/180;
    for(const g of rotorsN2)g.rotation.x=deg*1.6*Math.PI/180;},
  info:()=>{const r=renderer.info;return {calls:r.render.calls,tris:r.render.triangles};},
  /* 爆炸态装配体包围盒相交检测(嵌套属正常: 短舱×风扇/帽罩/OGV, 轴系×各鼓筒) */
  collide(k){
    const keep=explodeK; explodeK=k; applyExplode();
    const names=Object.keys(ASM), boxes={}, bad=[];
    for(const nm of names){ const b=new THREE.Box3();
      ASM[nm].group.updateWorldMatrix(true,true); b.setFromObject(ASM[nm].group); boxes[nm]=b; }
    for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){
      const A=names[i],B=names[j];
      const nested=(A==='inlet'||B==='inlet'||A==='shafts'||B==='shafts');
      if(!nested && boxes[A].intersectsBox(boxes[B])) bad.push(A+'×'+B);
    }
    explodeK=keep; applyExplode(); return bad;
  }
};
playAssembly();   // 开机装配动画(从爆炸剖视收拢)
animate();
};

const loader=document.getElementById('loader');
BOOT().then(()=>{ loader.style.opacity='0'; setTimeout(()=>loader.remove(),700); })
.catch(err=>{ console.error(err);
  loader.querySelector('.ring').style.display='none';
  loader.querySelector('p').textContent='三维引擎初始化失败: '+(err&&err.message?err.message:err);
  loader.querySelector('button').style.display='block'; });
</script>
