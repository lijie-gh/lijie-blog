<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雨夜便利店 · 微缩模型</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden}
  #rainy-store-view{height:100% !important;border-radius:0 !important}
</style>
</head>
<body>
<div id="rainy-store-view"></div>
<script>
/* ============================================================
   雨夜便利店 · Rainy Night Convenience Store (miniature diorama)
   Self-contained classic script. Loads three.js core from CDN
   (with fallbacks), then renders the scene into #rainy-store-view.
   ============================================================ */
(function () {
'use strict';

/* ---------- boot: load three.js core with CDN fallbacks ---------- */
var CDNS = [
  'https://registry.npmmirror.com/three/0.170.0/files/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js',
  'https://unpkg.com/three@0.170.0/build/three.module.js',
  'https://esm.sh/three@0.170.0'
];

function withTimeout(p, ms, tag) {
  return new Promise(function (res, rej) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; rej(new Error('timeout ' + tag)); } }, ms);
    p.then(function (v) { if (!done) { done = true; clearTimeout(timer); res(v); } },
           function (e) { if (!done) { done = true; clearTimeout(timer); rej(e); } });
  });
}

function loadThree() {
  var i = 0;
  function tryNext(lastErr) {
    if (i >= CDNS.length) return Promise.reject(lastErr || new Error('all CDNs failed'));
    var url = CDNS[i++];
    return withTimeout(import(url), 14000, url)
      .then(function (m) {
        if (m && m.WebGLRenderer) return m;
        throw new Error('bad module from ' + url);
      })
      .catch(function (e) { return tryNext(e); });
  }
  return tryNext(null);
}

/* ---------- shared styles (injected once) ---------- */
function ensureStyle() {
  if (document.getElementById('rs-style')) return;
  var css = [
    '#rainy-store-view{position:relative;height:660px;border-radius:18px;overflow:hidden;background:#05070c;',
    'font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:#e8f1ec;}',
    '@media (max-width:640px){#rainy-store-view{height:480px;border-radius:14px}}',
    '@media (min-width:1280px){#rainy-store-view{height:720px}}',
    '#rainy-store-view .rs-frame{position:absolute;inset:0;overflow:hidden}',
    '#rainy-store-view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}',
    '#rainy-store-view .rs-vignette{position:absolute;inset:0;z-index:2;pointer-events:none;',
    'background:radial-gradient(120% 95% at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.16) 66%, rgba(2,4,8,.62) 100%);}',
    '#rainy-store-view .rs-ui{position:absolute;inset:0;z-index:3;pointer-events:none;transition:opacity .35s ease}',
    '#rainy-store-view .rs-ui>*{pointer-events:auto}',
    '#rainy-store-view.rs-hide-ui .rs-ui{opacity:0;pointer-events:none}',
    '#rainy-store-view .rs-title{position:absolute;left:22px;top:20px;letter-spacing:.5em;font-size:23px;font-weight:600;',
    'color:#f2f8f4;text-shadow:0 2px 18px rgba(0,0,0,.8),0 0 24px rgba(90,220,160,.25);}',
    '#rainy-store-view .rs-sub{position:absolute;left:23px;top:58px;letter-spacing:.34em;font-size:9.5px;color:#8fb3a6;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.9);}',
    '#rainy-store-view .rs-tag{position:absolute;left:22px;top:82px;display:inline-flex;gap:7px;align-items:center;',
    'padding:4px 11px;border-radius:999px;font-size:10px;letter-spacing:.22em;color:#b9d8cb;',
    'border:1px solid rgba(150,205,180,.24);background:rgba(8,14,15,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}',
    '#rainy-store-view .rs-dot{width:5px;height:5px;border-radius:50%;background:#57e6a4;box-shadow:0 0 8px #57e6a4;}',
    '#rainy-store-view .rs-hint{position:absolute;left:22px;bottom:16px;font-size:10.5px;letter-spacing:.16em;color:#7f978e;',
    'text-shadow:0 1px 8px rgba(0,0,0,.9);}',
    '#rainy-store-view .rs-ctrls{position:absolute;right:16px;bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}',
    '@media (max-width:560px){#rainy-store-view .rs-ctrls{left:14px;right:14px;flex-direction:row;flex-wrap:wrap;justify-content:flex-end}',
    '#rainy-store-view .rs-hint{display:none}}',
    '#rainy-store-view .rs-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;',
    'font-size:12px;letter-spacing:.08em;color:#d7e8df;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;',
    'border:1px solid rgba(152,190,172,.25);background:rgba(9,15,17,.58);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);',
    'transition:border-color .22s,background .22s,box-shadow .22s,color .22s;font-family:inherit;}',
    '#rainy-store-view .rs-chip:hover{border-color:rgba(110,230,175,.55);background:rgba(13,22,24,.72)}',
    '#rainy-store-view .rs-chip:focus-visible{outline:2px solid #57e6a4;outline-offset:2px}',
    '#rainy-store-view .rs-chip[aria-pressed="true"]{border-color:rgba(105,232,175,.7);color:#c8f7e0;',
    'box-shadow:inset 0 0 0 1px rgba(105,232,175,.28),0 0 16px rgba(80,220,160,.16);}',
    '#rainy-store-view .rs-chip .rs-ic{opacity:.9;font-size:13px;line-height:1}',
    '#rainy-store-view .rs-veil{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;',
    'background:radial-gradient(90% 80% at 50% 45%, #0a1016 0%, #04060a 100%);transition:opacity .8s ease;z-index:5;}',
    '#rainy-store-view .rs-veil.rs-gone{opacity:0;pointer-events:none}',
    '#rainy-store-view .rs-load-title{letter-spacing:.55em;font-size:19px;color:#dcefe6;text-shadow:0 0 22px rgba(90,220,160,.35)}',
    '#rainy-store-view .rs-load-note{font-size:11px;letter-spacing:.3em;color:#5f7a70;min-height:14px}',
    '#rainy-store-view .rs-rainlines{width:120px;height:26px;position:relative;opacity:.85}',
    '#rainy-store-view .rs-rainlines i{position:absolute;top:0;width:1px;height:14px;background:linear-gradient(rgba(150,220,190,0),rgba(150,220,190,.9));',
    'animation:rs-fall 1.1s linear infinite}',
    '@keyframes rs-fall{from{transform:translateY(-16px)}to{transform:translateY(30px)}}',
    '#rainy-store-view .rs-err{max-width:560px;text-align:center;line-height:1.8;font-size:13px;color:#c6d8cf;padding:0 26px}',
    '#rainy-store-view .rs-err b{color:#ffd9a0}',
    '#rainy-store-view .rs-toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%) translateY(6px);opacity:0;',
    'padding:9px 18px;border-radius:999px;font-size:12px;letter-spacing:.1em;color:#eaf6ef;background:rgba(10,16,18,.8);',
    'border:1px solid rgba(140,190,170,.3);backdrop-filter:blur(8px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:4;white-space:nowrap}',
    '#rainy-store-view .rs-toast.rs-on{opacity:1;transform:translateX(-50%) translateY(0)}'
  ].join('\n');
  var s = document.createElement('style');
  s.id = 'rs-style';
  s.textContent = css;
  document.head.appendChild(s);
}

/* ============================================================
   MAIN SCENE
   ============================================================ */
window.__RAINSTORE__ = function (THREE, root) {

  /* ---------- tiny helpers ---------- */
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function canvasTex(w, h, draw, opt) {
    opt = opt || {};
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    draw(cv.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(cv);
    t.colorSpace = opt.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    t.anisotropy = 8;
    if (opt.wrap) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    return t;
  }
  function mesh(geo, mat, x, y, z) {
    var m = new THREE.Mesh(geo, mat);
    if (x !== undefined) m.position.set(x, y, z);
    return m;
  }
  function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
  function cyl(rt, rb, h, mat, seg) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 12), mat); }
  var matCache = [];
  function std(o) { var m = new THREE.MeshStandardMaterial(o); matCache.push(m); return m; }

  /* ---------- renderer / scene / camera ---------- */
  var W = 1, H = 1, DPR = Math.min(window.devicePixelRatio || 1, 1.6);
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  } catch (e) {
    throw new Error('WEBGL_UNAVAILABLE');
  }
  renderer.setPixelRatio(DPR);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NoToneMapping;
  var frameEl = root.querySelector('.rs-frame');
  if (frameEl) frameEl.insertBefore(renderer.domElement, frameEl.firstChild);
  else root.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060911);
  scene.fog = new THREE.FogExp2(0x0a0f19, 0.0165);

  var camera = new THREE.PerspectiveCamera(37, 1, 0.3, 140);
  var TARGET = new THREE.Vector3(0.4, 1.4, -0.7);

  /* ---------- lights (fixed part) ---------- */
  var hemi = new THREE.HemisphereLight(0x2b3f63, 0x0a0c10, 0.42);
  scene.add(hemi);
  var moon = new THREE.DirectionalLight(0x51739f, 0.55);
  moon.position.set(-9, 13, 7);
  scene.add(moon);

  var flickerLight = new THREE.PointLight(0xe2fff0, 24, 9.5, 2);
  flickerLight.position.set(-1.7, 2.45, -2.5);
  scene.add(flickerLight);
  var steadyLight = new THREE.PointLight(0xe2fff0, 22, 9.5, 2);
  steadyLight.position.set(0.9, 2.45, -2.5);
  scene.add(steadyLight);
  var doorLight = new THREE.PointLight(0xffe3b0, 4, 8, 2);
  doorLight.position.set(0, 2.6, -0.15);
  scene.add(doorLight);
  var vendingLight = new THREE.PointLight(0xfff2df, 5, 4.5, 2);
  vendingLight.position.set(-4.3, 2.5, 0.15);
  scene.add(vendingLight);
  var backBulbLight = new THREE.PointLight(0xffc98a, 7, 5, 2);
  backBulbLight.position.set(-2.05, 2.3, -4.55);
  scene.add(backBulbLight);

  var streetLamp = new THREE.SpotLight(0xffe7bd, 78, 26, 0.64, 0.6, 2);
  streetLamp.position.set(7.3, 5.55, 4.7);
  streetLamp.target.position.set(4.6, 0, 1.6);
  streetLamp.castShadow = true;
  streetLamp.shadow.mapSize.set(1024, 1024);
  streetLamp.shadow.camera.near = 0.6;
  streetLamp.shadow.camera.far = 24;
  streetLamp.shadow.bias = -0.0004;
  streetLamp.shadow.normalBias = 0.03;
  scene.add(streetLamp);
  scene.add(streetLamp.target);

  /* ============================================================
     GROUND (canvas painted) + under-glows + puddles
     ============================================================ */
  var GX0 = 9.5, GZ0 = -7.225, GW = 19, GD = 14.25;
  var px = function (x) { return (x + GX0) / GW; };
  var pz = function (z) { return (z - GZ0) / GD; };

  var puddles = (function () {
    var r = rng(770402), list = [];
    for (var i = 0; i < 52; i++) {
      var u = r(), z;
      if (u < 0.44) z = -0.7 + r() * 4.1;          // forecourt
      else if (u < 0.66) z = 3.55 + r() * 0.75;    // gutter
      else if (u < 0.9) z = 4.4 + r() * 2.1;       // road
      else z = -6.8 + r() * 5.6;                   // back alley
      list.push({ x: -9.1 + r() * 18.2, z: z, rx: 0.45 + r() * 1.75, rz: 0.3 + r() * 0.95, a: 0.5 + r() * 0.5 });
    }
    return list;
  })();

  var groundMap = canvasTex(2048, 1536, function (g, W2, H2) {
    var r = rng(20261014);
    var X = function (x) { return (x + GX0) / GW * W2; };
    var Z = function (z) { return (z - GZ0) / GD * H2; };
    function band(z0, z1, style) { g.fillStyle = style; g.fillRect(0, Z(z0), W2, Z(z1) - Z(z0)); }
    band(GZ0, 7.0, '#15181d');                          // asphalt base
    band(-1.0, 3.6, '#25282e');                          // forecourt pavement
    band(3.6, 4.06, '#2e323a');                          // gutter strip
    band(3.6, 7.0, '#101317');                           // road
    band(6.58, 7.0, '#1e2126');                          // far sidewalk
    band(3.5, 3.64, '#4b5058');                          // curb painted line
    // pavement tile grid
    g.strokeStyle = 'rgba(0,0,0,.24)'; g.lineWidth = 2;
    for (var tx = -9.5; tx <= 9.6; tx += 1.0) { g.beginPath(); g.moveTo(X(tx), Z(-1)); g.lineTo(X(tx), Z(3.6)); g.stroke(); }
    for (var tz = -1.0; tz <= 3.7; tz += 1.0) { g.beginPath(); g.moveTo(X(-9.5), Z(tz)); g.lineTo(X(9.5), Z(tz)); g.stroke(); }
    // tile shade variation
    for (var i = 0; i < 260; i++) {
      var cx = -9.5 + Math.floor(r() * 19), cz = -1 + Math.floor(r() * 4.6);
      g.fillStyle = 'rgba(' + (r() < 0.5 ? '0,0,0' : '255,255,255') + ',' + (0.02 + r() * 0.04).toFixed(3) + ')';
      g.fillRect(X(cx), Z(cz), X(cx + 1) - X(cx) - 1, Z(cz + 1) - Z(cz) - 1);
    }
    // puddle darkening (same blob list)
    for (var p = 0; p < puddles.length; p++) {
      var pd = puddles[p];
      var gx = X(pd.x), gz = Z(pd.z), grx = pd.rx / GW * W2, grz = pd.rz / GD * H2;
      g.save(); g.translate(gx, gz); g.scale(grx, grz);
      var gr = g.createRadialGradient(0, 0, 0.1, 0, 0, 1);
      gr.addColorStop(0, 'rgba(6,8,11,' + (0.5 * pd.a).toFixed(2) + ')');
      gr.addColorStop(0.72, 'rgba(6,8,11,' + (0.34 * pd.a).toFixed(2) + ')');
      gr.addColorStop(1, 'rgba(6,8,11,0)');
      g.fillStyle = gr; g.fillRect(-1, -1, 2, 2); g.restore();
    }
    // zebra crosswalk (bars run along the crossing direction)
    g.fillStyle = 'rgba(210,215,210,.68)';
    for (var zx = 2.6; zx < 6.0; zx += 1.05) g.fillRect(X(zx), Z(3.68), X(zx + 0.56) - X(zx), Z(6.56) - Z(3.68));
    // zebra wear
    for (var w = 0; w < 900; w++) {
      var wx = 2.6 + r() * 3.4, wz = 3.68 + r() * 2.9;
      if (wx < 6.4) { g.fillStyle = 'rgba(16,19,23,' + (0.1 + r() * 0.3).toFixed(2) + ')'; g.fillRect(X(wx), Z(wz), 3 + r() * 6, 2 + r() * 4); }
    }
    // parking slot lines (left forecourt)
    g.strokeStyle = 'rgba(198,204,200,.26)'; g.lineWidth = 4;
    [-8.5, -7.1, -5.7].forEach(function (lx) { g.beginPath(); g.moveTo(X(lx), Z(-0.7)); g.lineTo(X(lx), Z(2.9)); g.stroke(); });
    g.beginPath(); g.moveTo(X(-8.5), Z(2.9)); g.lineTo(X(-5.7), Z(2.9)); g.stroke();
    // manhole
    g.beginPath(); g.arc(X(-1.9), Z(2.35), 0.38 / GW * W2, 0, 6.283); g.fillStyle = '#0c0e11'; g.fill();
    g.lineWidth = 5; g.strokeStyle = '#2c3138'; g.stroke();
    g.beginPath(); g.arc(X(-1.9), Z(2.35), 0.24 / GW * W2, 0, 6.283); g.strokeStyle = '#1c2026'; g.lineWidth = 3; g.stroke();
    // drain grate near curb
    g.fillStyle = '#0b0d10'; g.fillRect(X(1.0), Z(3.62), X(2.1) - X(1.0), Z(3.98) - Z(3.62));
    g.fillStyle = '#22262c';
    for (var d = 0; d < 6; d++) g.fillRect(X(1.05 + d * 0.17), Z(3.66), 5, Z(3.94) - Z(3.66));
    // general speckle noise
    for (var sp = 0; sp < 15000; sp++) {
      g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,' + (0.012 + r() * 0.035).toFixed(3) + ')' :
                                'rgba(0,0,0,' + (0.02 + r() * 0.05).toFixed(3) + ')';
      g.fillRect(r() * W2, Z(-1) + r() * (H2 - Z(-1)), 1 + r() * 2.2, 1 + r() * 2.2);
    }
    // back alley grime
    for (var b = 0; b < 500; b++) {
      g.fillStyle = 'rgba(' + (r() < 0.6 ? '0,0,0' : '120,110,90') + ',' + (0.03 + r() * 0.05).toFixed(3) + ')';
      g.fillRect(r() * W2, r() * Z(-1), 2 + r() * 10, 2 + r() * 6);
    }
  });
  groundMap.anisotropy = renderer.capabilities.getMaxAnisotropy ? Math.min(8, renderer.capabilities.getMaxAnisotropy()) : 8;

  var groundAlpha = canvasTex(1024, 768, function (g, W2, H2) {
    var X = function (x) { return (x + GX0) / GW * W2; };
    var Z = function (z) { return (z - GZ0) / GD * H2; };
    g.fillStyle = 'rgb(200,200,200)'; g.fillRect(0, 0, W2, H2);   // mostly dry
    for (var p = 0; p < puddles.length; p++) {
      var pd = puddles[p];
      g.save(); g.translate(X(pd.x), Z(pd.z)); g.scale(pd.rx / GW * W2, pd.rz / GD * H2);
      var gr = g.createRadialGradient(0, 0, 0.05, 0, 0, 1);
      gr.addColorStop(0, 'rgba(46,46,46,1)');
      gr.addColorStop(0.62, 'rgba(60,60,60,1)');
      gr.addColorStop(1, 'rgba(200,200,200,0)');
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = gr; g.fillRect(-1.05, -1.05, 2.1, 2.1); g.restore();
    }
    // overall dampness streaks
    for (var s = 0; s < 10; s++) {
      var sx = Math.random() * W2, sy = Math.random() * H2;
      var rg = g.createRadialGradient(sx, sy, 0, sx, sy, 90 + Math.random() * 160);
      rg.addColorStop(0, 'rgba(180,180,180,.5)'); rg.addColorStop(1, 'rgba(180,180,180,0)');
      g.fillStyle = rg; g.fillRect(0, 0, W2, H2);
    }
  }, { linear: true });

  var groundRough = canvasTex(1024, 768, function (g, W2, H2) {
    var X = function (x) { return (x + GX0) / GW * W2; };
    var Z = function (z) { return (z - GZ0) / GD * H2; };
    g.fillStyle = 'rgb(218,218,218)'; g.fillRect(0, 0, W2, H2);
    for (var p = 0; p < puddles.length; p++) {
      var pd = puddles[p];
      g.save(); g.translate(X(pd.x), Z(pd.z)); g.scale(pd.rx / GW * W2, pd.rz / GD * H2);
      var gr = g.createRadialGradient(0, 0, 0.05, 0, 0, 1);
      gr.addColorStop(0, 'rgba(78,78,78,1)');
      gr.addColorStop(0.62, 'rgba(104,104,104,1)');
      gr.addColorStop(1, 'rgba(218,218,218,0)');
      g.fillStyle = gr; g.fillRect(-1.05, -1.05, 2.1, 2.1); g.restore();
    }
  }, { linear: true });

  var groundMat = std({
    map: groundMap, alphaMap: groundAlpha, roughnessMap: groundRough,
    color: 0xffffff, roughness: 1.0, metalness: 0.0, transparent: true, depthWrite: false
  });
  var ground = mesh(new THREE.PlaneGeometry(GW, GD), groundMat, 0, 0, GZ0 + GD / 2);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.renderOrder = 2;
  scene.add(ground);

  /* under-glow reflection pools (seen through the translucent ground) */
  function poolTex(inner, mid, w, h) {
    return canvasTex(w || 256, h || 128, function (g, W2, H2) {
      g.save(); g.translate(W2 / 2, H2 / 2); g.scale(W2 / 2, H2 / 2);
      var gr = g.createRadialGradient(0, 0, 0.02, 0, 0, 1);
      gr.addColorStop(0, inner); gr.addColorStop(0.55, mid); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 1, 0, 6.283); g.fill(); g.restore();
    });
  }
  /* vertical streak: bright edge (canvas top) fades toward the viewer, ends feathered */
  function streakTex(inner, mid, w, h) {
    return canvasTex(w || 256, h || 256, function (g, W2, H2) {
      var gv = g.createLinearGradient(0, 0, 0, H2);
      gv.addColorStop(0, inner);
      gv.addColorStop(0.32, mid);
      gv.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gv; g.fillRect(0, 0, W2, H2);
      g.globalCompositeOperation = 'destination-in';
      var gh = g.createLinearGradient(0, 0, W2, 0);
      gh.addColorStop(0, 'rgba(0,0,0,0)'); gh.addColorStop(0.14, 'rgba(0,0,0,1)');
      gh.addColorStop(0.86, 'rgba(0,0,0,1)'); gh.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gh; g.fillRect(0, 0, W2, H2);

    f1.rotation.y = Math.PI / 2; f1.rotation.z = 0.52;

    var f2 = f1.clone(); f2.position.z = -0.55; g.add(f2);
    function tube(a, b, r) {
      var va = new THREE.Vector3(a[0], a[1], a[2]), vb = new THREE.Vector3(b[0], b[1], b[2]);
      var dir = vb.clone().sub(va);
      var len = dir.length();
      var t = cyl(r, r, len, body, 8);
      t.position.copy(va).add(dir.multiplyScalar(0.5));
      t.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vb.clone().sub(va).normalize());
      g.add(t);
      return t;
    }
    tube([0, 0.36, 0], [0, 0.9, -0.3], 0.022);            // seat tube
    tube([0, 0.9, -0.3], [0, 0.92, 0.44], 0.022);         // top tube
    tube([0, 0.36, 0], [0, 0.92, 0.44], 0.022);           // down tube
    tube([0, 0.36, 0], [0, 0.33, -0.55], 0.018);          // chain stay

  var orbit = (function () {
    var st = { theta: 0.62, phi: 1.12, radius: 23.5 };

    var lim = { minPhi: 0.24, maxPhi: 1.45, minR: 9.5, maxR: 42 };

    var pointers = new Map();
    var lastPinch = 0;
    var autoRotate = true;
    var autoSpeed = 0.135;

    function clampT() {
      tg.phi = clamp(tg.phi, lim.minPhi, lim.maxPhi);

    }
    function onDown(e) {

        moved = true;
      }
    }

      pointers.delete(e.pointerId);
      if (pointers.size < 2) lastPinch = 0;
      if (pointers.size === 0) dragging = false;
    }

      e.preventDefault();
      tg.radius *= Math.exp(e.deltaY * 0.0011);
      clampT();
    }

    dom.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);

      '  <button type="button" class="rs-chip" id="rs-rot" aria-pressed="true"><span class="rs-ic">⟳</span><span>自动旋转 · 开</span></button>' +
      '  <button type="button" class="rs-chip" id="rs-snd" aria-pressed="false"><span class="rs-ic">♪</span><span>雨声 · 关</span></button>' +
      '  <button type="button" class="rs-chip" id="rs-shot"><span class="rs-ic">◉</span><span>保存截图</span></button>' +
      '</div>';
    root.querySelector('.rs-frame').appendChild(wrap);

    var toast = document.createElement('div');
    toast.className = 'rs-toast';
    root.querySelector('.rs-frame').appendChild(toast);
    var toastTimer = 0;
    function say(msg) {
      toast.textContent = msg;
      toast.classList.add('rs-on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('rs-on'); }, 2400);
    }

    var btnRain = wrap.querySelector('#rs-rain');
    var rainLabel = wrap.querySelector('#rs-rain-label');
    btnRain.addEventListener('click', function () {
      rainLevel = (rainLevel + 1) % rainLevels.length;
      var lv = rainLevels[rainLevel];
      rainLabel.textContent = '雨量 · ' + lv.label;
      btnRain.setAttribute('aria-pressed', lv.count > 0 ? 'true' : 'false');
      audio.setLevel(soundOn ? lv.sound : 0);
      say(lv.count === 0 ? '雨停了' : '雨势 · ' + lv.label);
    });

    var btnRot = wrap.querySelector('#rs-rot');
    btnRot.addEventListener('click', function () {
      var v = !orbit.getAutoRotate();
      orbit.setAutoRotate(v);
      btnRot.setAttribute('aria-pressed', v ? 'true' : 'false');
      btnRot.lastElementChild.textContent = '自动旋转 · ' + (v ? '开' : '关');
    });

    var btnSnd = wrap.querySelector('#rs-snd');
    var soundOn = false;
    btnSnd.addEventListener('click', function () {
      soundOn = !soundOn;
      audio.setLevel(soundOn ? rainLevels[rainLevel].sound : 0);
      btnSnd.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
      btnSnd.lastElementChild.textContent = '雨声 · ' + (soundOn ? '开' : '关');
      if (soundOn && !audio.ok()) { soundOn = false; say('当前环境无法播放声音'); }
      else say(soundOn ? '雨声已开启' : '雨声已关闭');
    });

    var shotPending = false;
    wrap.querySelector('#rs-shot').addEventListener('click', function () { shotPending = true; });

    var prevDrag = false;
    renderer.domElement.addEventListener('dblclick', function () { toggleUI(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'h' || e.key === 'H') toggleUI();
    });
    function toggleUI() {
      root.classList.toggle('rs-hide-ui');
      if (!root.classList.contains('rs-hide-ui')) return;
      say('双击或按 H 恢复界面');
    }

    return {
      say: say,
      takeShot: function () { if (shotPending) { shotPending = false; return true; } return false; },
      toggleUI: toggleUI
    };
  })();

  function saveShot() {
    try {
      var url = renderer.domElement.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = url;
      a.download = '雨夜便利店-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      ui.say('截图已保存');
    } catch (e1) {
      try {
        var w = window.open();
        if (w) { w.document.write('<img src="' + renderer.domElement.toDataURL('image/png') + '" style="max-width:100%">'); ui.say('已在新窗口打开截图，右键保存'); }
        else ui.say('无法保存截图，请直接对画面截图');
      } catch (e2) { ui.say('无法保存截图，请直接对画面截图'); }
    }
  }

  /* ============================================================
     RESIZE + LOOP
     ============================================================ */
  function resize() {
    var r = root.getBoundingClientRect();
    W = Math.max(2, Math.round(r.width));
    H = Math.max(2, Math.round(r.height));
    renderer.setSize(W, H, true);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    buildRTs();
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () { resize(); }).observe(root);
  }
  window.addEventListener('resize', resize);

  /* flicker & mood state */
  var flickState = { t: 0, next: 6, burst: 0, level: 24 };
  var flash = { next: 18, t: -1, dur: 0, amp: 0 };
  var anthemMat = antBulbMat;

  var last = performance.now();
  var bootTime = last;
  var veilGone = false;

  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now / 1000;

    orbit.update(dt);
    updateRain(dt, t);

    // flicker of one interior tube
    flickState.t += dt;
    if (flickState.burst > 0) {
      flickState.burst -= dt;
      flickState.level = Math.random() < 0.5 ? 4 + Math.random() * 12 : 22;
    } else {
      flickState.level += (24 - flickState.level) * Math.min(1, dt * 6);
      flickState.t = flickState.t;
      if (t > flickState.next) {
        flickState.burst = 0.35 + Math.random() * 0.5;
        flickState.next = t + 6 + Math.random() * 14;
      }
    }
    flickerLight.intensity = flickState.level + Math.sin(t * 37) * 0.6;

    // pool shimmer
    for (var i = 0; i < pools.length; i++) {
      var p = pools[i];
      p.m.material.opacity = p.base * (1 + 0.13 * Math.sin(t * 1.1 + p.seed) + 0.07 * Math.sin(t * 2.3 + p.seed * 1.7));
    }

    // rooftop red light blink
    var blink = (t % 2.6) < 1.0;
    anthemMat.color.setRGB(blink ? 1 : 0.12, blink ? 0.26 : 0.03, blink ? 0.2 : 0.03);

    // distant lightning
    var exposureTarget = 1.12;
    if (flash.t >= 0) {
      flash.t += dt;
      if (flash.t > flash.dur) { flash.t = -1; }
      else {
        var f = Math.sin(Math.PI * (flash.t / flash.dur));
        hemi.intensity = 0.5 + f * 1.5;
        exposureTarget = 1.12 + f * 0.3;
        scene.fog.color.setRGB(0.04 + f * 0.2, 0.06 + f * 0.22, 0.10 + f * 0.3);
      }
    } else {
      hemi.intensity += (0.5 - hemi.intensity) * Math.min(1, dt * 3);
      scene.fog.color.lerp(new THREE.Color(0x0a0f19), Math.min(1, dt * 3));
      if (t > flash.next) {
        flash.t = 0; flash.dur = 0.7 + Math.random() * 0.5;
        flash.amp = 0.5 + Math.random() * 0.5;
        flash.next = t + 26 + Math.random() * 40;
      }
    }
    compMat.uniforms.uExposure.value += (exposureTarget - compMat.uniforms.uExposure.value) * Math.min(1, dt * 8);

    renderFrame();

    if (ui.takeShot()) saveShot();

    if (!veilGone && now - bootTime > 250) {
      veilGone = true;
      var veil = root.querySelector('.rs-veil');
      if (veil) { veil.classList.add('rs-gone'); setTimeout(function () { if (veil.parentNode) veil.parentNode.removeChild(veil); }, 900); }
    }
  }

  resize();
  orbit.update(0.016);
  requestAnimationFrame(loop);
};

/* ============================================================
   BOOTSTRAP + error/loading UI
   ============================================================ */
function boot() {
  var root = document.getElementById('rainy-store-view');
  if (!root || root.querySelector('.rs-frame')) return;
  ensureStyle();
  var frame = document.createElement('div');
  frame.className = 'rs-frame';
  root.appendChild(frame);
  var veil = document.createElement('div');
  veil.className = 'rs-veil';
  veil.innerHTML =
    '<div class="rs-rainlines"><i style="left:10%"></i><i style="left:26%;animation-delay:.18s"></i><i style="left:44%;animation-delay:.36s"></i>' +
    '<i style="left:62%;animation-delay:.1s"></i><i style="left:80%;animation-delay:.5s"></i><i style="left:92%;animation-delay:.28s"></i></div>' +
    '<div class="rs-load-title">雨 夜 便 利 店</div>' +
    '<div class="rs-load-note" id="rs-load-note">正在接通雨夜…</div>';
  root.appendChild(veil);
  try { if (new URLSearchParams(location.search).has('rs_instant')) veil.style.display = 'none'; } catch (e0) {}
  var vin = document.createElement('div');
  vin.className = 'rs-vignette';
  frame.appendChild(vin);

  var note = veil.querySelector('#rs-load-note');
  var n = 1;
  var noteTimer = setInterval(function () {
    n++;
    var msgs = ['正在接通雨夜…', '正在点亮店招…', '正在下这一场雨…'];
    if (note) note.textContent = msgs[n % msgs.length];
  }, 2600);

  loadThree().then(function (THREE) {
    clearInterval(noteTimer);
    try {
      window.__RAINSTORE__(THREE, root);
    } catch (e) {
      showError(e);
    }
  }).catch(function (e) {
    clearInterval(noteTimer);
    showError(e);
  });

  function showError(e) {
    var isWebgl = e && /WEBGL_UNAVAILABLE/.test(String(e.message || e));
    veil.innerHTML =
      '<div class="rs-load-title" style="letter-spacing:.3em">雨 夜 还 没 亮 起 来</div>' +
      '<div class="rs-err">' +
      (isWebgl
        ? '当前环境不支持 WebGL。请尝试使用 Chrome / Edge 打开，或在新窗口中查看。'
        : '无法加载 3D 引擎（three.js）。<br>请检查网络连接后刷新页面；<br>若在聊天窗口中无法加载，可<b>用浏览器直接打开 rainy-night-store.html</b> 再试。') +
      '</div>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();

</script>
</body>
</html>
